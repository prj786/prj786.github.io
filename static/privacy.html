<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Privacy policy — ewe</title>
		<!-- The policy moved to /privacy/ when the site became SvelteKit. This
		     stub keeps the original URL working — it may be registered with
		     Google as the app's privacy policy link. -->
		<link rel="canonical" href="https://prj786.github.io/privacy/" />
		<meta http-equiv="refresh" content="0; url=/privacy/" />
		<meta name="robots" content="noindex" />
		<style>
			/* This file is served on its own, so it cannot read tokens.css: the
			   two schemes are written out, Ewe Dark first. */
			body {
				background: #0b0a08;
				color: #d5d2cb;
				font-family: Geist, 'Noto Sans Georgian', system-ui, sans-serif;
				display: grid;
				place-items: center;
				min-height: 100svh;
				margin: 0;
			}
			a { color: #f8c23a; }
			@media (prefers-color-scheme: light) {
				body { background: #f4f2ee; color: #423f3a; }
				a { color: #805708; }
			}
		</style>
	</head>
	<body>
		<p>The privacy policy has moved to <a href="/privacy/">prj786.github.io/privacy/</a>.</p>
	</body>
</html>
