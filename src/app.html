<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Before first paint: the scheme the visitor chose with the header
			// toggle (ThemeToggle.svelte). No choice, or no storage, leaves
			// data-theme unset and tokens.css follows prefers-color-scheme.
			(function () {
				var root = document.documentElement;
				root.classList.add('js');
				try {
					var t = localStorage.getItem('ewe-theme');
					if (t === 'light' || t === 'dark') root.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preload" href="%sveltekit.assets%/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/geist.css" />
		<meta name="color-scheme" content="dark light" />
		<!-- the browser's own chrome, in surface-base for each scheme -->
		<meta name="theme-color" content="#0b0a08" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
