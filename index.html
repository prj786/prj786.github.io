<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ewe</title>
<link rel="icon" href="favicon.png">
<meta name="description" content="ewe — the simplest Arch-based desktop. One file, one sign-in, no headaches.">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #101317; color: #e6e6e6; font-family: Ubuntu, system-ui, sans-serif;
         min-height: 100svh; display: grid; place-items: center; padding: 2rem; }
  main { max-width: 34rem; text-align: center; }
  img.mark { width: 130px; opacity: .92; }
  h1 { font-size: 2.6rem; letter-spacing: -.02em; margin: 1rem 0 .4rem; }
  p.tag { color: #9aa3ad; line-height: 1.55; }
  .links { margin-top: 1.6rem; display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
  a.btn { color: #e6e6e6; text-decoration: none; border: 1px solid #2a2f36; padding: .55rem 1.1rem;
          border-radius: .7rem; font-size: .92rem; }
  a.btn:hover { background: #1a1f26; }
  a.primary { background: #0a84ff; border-color: #0a84ff; color: #fff; }
  a.primary:hover { background: #2492ff; }
  footer { margin-top: 2.2rem; font-size: .78rem; color: #5c6570; }
  footer a { color: #8b95a1; }
</style>
</head>
<body>
<main>
  <img class="mark" src="ewe-logo.png" alt="the ewe sheep mark">
  <h1>ewe</h1>
  <p class="tag">The simplest Arch-based desktop. Your whole machine described by one file,
  one sign-in for everything, decisions made so you never have to.
  Free — but premium.</p>
  <div class="links">
    <a class="btn primary" href="https://github.com/prj786/ewe-os/releases">Download (alpha)</a>
    <a class="btn" href="https://github.com/prj786/ewe">GitHub</a>
    <a class="btn" href="privacy.html">Privacy</a>
  </div>
  <footer>ewe OS · Arch-based · <a href="https://github.com/prj786/ewe-os">source</a> — a proper site is coming with 1.0 “Dolly”.</footer>
</main>
</body>
</html>
